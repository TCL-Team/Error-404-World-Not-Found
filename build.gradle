plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom already adds Minecraft + Fabric maven repos. Add third-party repos here if needed.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"error404" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def modVersion = project.version
def modName = project.name

processResources {
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	// Loom 1.19 runs on JDK 25, but the mod targets Java 21 bytecode so the jar keeps
	// working on Minecraft 1.21.11 servers running a 21 JVM.
	it.options.release = 21
	it.options.encoding = "UTF-8"
	// One CI run should surface every error, not just the first hundred.
	it.options.compilerArgs += ["-Xmaxerrs", "500"]
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${modName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		// Publishing targets can be added later (Modrinth/CurseForge maven, local repo...).
	}
}
