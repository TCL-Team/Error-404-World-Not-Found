name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (compile + jar)
        run: ./gradlew build --stacktrace --no-daemon

      - name: Upload jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error404-jar
          path: build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error404-build-report
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 7
