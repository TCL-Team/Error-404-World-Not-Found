name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Loom 1.19.x requires a JDK 25 runtime (Minecraft 26.x toolchain). The mod itself
      # is still compiled with --release 21, so the jar stays loadable on 1.21.11.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (compile + jar)
        id: gradle
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --continue --stacktrace --no-daemon --console=plain 2>&1 | tee build.log

      - name: Summarize errors
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build failed"
            echo '```'
            grep -nE "error:|error\.|FAILURE:|Caused by:|Could not|Unresolved|Execution failed|What went wrong" build.log | head -80 || tail -60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Also surface the failure as check-run annotations, so a remote agent can read it
          # through the GitHub API without downloading artifacts. javac puts the useful
          # detail ("symbol:", "location:", "required:") on the lines *after* "error:",
          # so each annotation carries the error line plus its following context.
          mapfile -t lines < <(awk '
            /error:/ {
              buf = $0
              for (i = 1; i <= 4; i++) {
                if (getline nxt <= 0) break
                if (nxt ~ /error:/) break
                buf = buf " | " nxt
              }
              gsub(/[[:space:]]+/, " ", buf)
              print buf
              next
            }
            /FAILURE:|Caused by:|Could not resolve|Execution failed|What went wrong|A problem occurred/ { print }
          ' build.log | head -40)
          if [ ${#lines[@]} -eq 0 ]; then
            mapfile -t lines < <(tail -40 build.log)
          fi
          i=0
          for line in "${lines[@]}"; do
            i=$((i+1))
            safe=$(printf '%s' "$line" | tr '%' '_' | tr '|' '/' | tr '\n' ' ' | sed 's/\r/ /g')
            echo "::error title=gradle-${i}::${safe:0:4000}"
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: error404-jar
          path: build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14
